[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loadsettle-curtail"
version = "0.1.0"
description = "Sleep and wake ASIC miners on a time-of-use schedule, and prove they actually did."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sean Whitfield" }]
dependencies = [
    "pyasic==0.79.0",
    "betterproto==2.0.0b7",      # pyasic 0.79 needs this pre-release
    "httpx>=0.27,<1",            # httpx 1.0 betas break pyasic
    "aiohttp>=3.9",
    "pyyaml>=6",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
curtail = "curtail.cli:main"

[tool.setuptools.packages.find]
include = ["curtail*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*class-based `config`.*"]
